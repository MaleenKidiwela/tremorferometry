# v1 target: Aug-Sep 2010 northern Cascadia ETS (southern Vancouver Island).
# This episode is the canonical one used by Bostock 2012/2015 for the LFE catalog;
# Lin (2023) Zenodo catalog has ~98k LFE detections inside this window.
event_id: ets_2010_vi

episode:
  t_start: 2010-08-15
  t_end:   2010-09-15
  bbox:    [48.0, 49.4, -124.6, -123.0]

stations:
  # Reliable PNSN/CN broadbands on southern V.I. and Olympic Peninsula
  # operating in 2010. Confirmed via IRIS/EarthScope FDSN metadata; HH? or BH?
  # at 100 / 40 Hz. Pat Bay (PGC) is the workhorse for Bostock LFE work.
  network: CN,UW,US
  list:    [PGC, NLLB, PABB, OZB, PTRF, SQM, NLWA]

match:
  cc_threshold: 0.4
  mad_multiplier: 8

stack:
  bin_days: 2

dvv:
  coda_window:      [5.0, 25.0]
  freq_band:        [2.0, 8.0]
  stretch_range:    0.02
  stretch_steps:    201
  min_detections:   20
  min_cc:           0.6
  reference_window: [-90, -30]
