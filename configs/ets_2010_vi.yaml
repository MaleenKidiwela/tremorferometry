# v1 target: well-recorded August 2010 southern Vancouver Island ETS episode.
# Replace t_start/t_end after 01_define_episode.py refines them from the PNSN catalog.
event_id: ets_2010_vi

episode:
  t_start: 2010-08-01
  t_end:   2010-09-01
  bbox:    [48.0, 49.5, -124.5, -122.5]   # lat_min, lat_max, lon_min, lon_max

stations:
  network: CN,UW
  list:    [SNB, PGC, LZB, TWKB, TWBB]

match:
  cc_threshold: 0.4
  mad_multiplier: 8

stack:
  bin_days: 2

dvv:
  coda_window:      [5.0, 25.0]    # s after S arrival
  freq_band:        [2.0, 8.0]
  stretch_range:    0.02           # +/- 2 %
  stretch_steps:    201
  min_detections:   20
  min_cc:           0.6
  reference_window: [-90, -30]     # days relative to episode.t_start
