[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tremorferometry"
version = "0.0.1"
description = "LFE coda-wave interferometry for dv/v across Cascadia ETS events"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "h5py>=3.8",
    "pyarrow>=14",
    "pyyaml>=6",
    "obspy>=1.4",
    "eqcorrscan>=0.5",
    "joblib>=1.3",
    "tqdm>=4.65",
]

[project.optional-dependencies]
gpu = [
    "fast-matched-filter>=1.4",
]
dev = [
    "pytest>=7",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"
